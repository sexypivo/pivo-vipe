# Настройки плагина pivo-vipe

# Время отсчёта в секундах
countdown-seconds: 120

# Текст тайтла во время отсчёта (title / subtitle)
# Доступный плейсхолдер: %time%
title:
  main: "&6&lВайп"
  sub: "&fДо закрытия на вайп осталось &6%time%"

# Текст в момент закрытия сервера на вайп
end-title:
  main: "&6&lВайп"
  sub: "&cСервер закрыт на вайп!"

# Сообщение в чат всем игрокам в момент вайпа
broadcast-message: "&6Вайп &7» &fсервер закрывается на вайп!"

# Сообщения команд
messages:
  started: "&6Вайп &7» &aОтсчёт до вайпа запущен (%time%)."
  already-running: "&6Вайп &7» &cОтсчёт до вайпа уже запущен!"
  usage: "&6Вайп &7» &cИспользование: /pivovipe start"
  unknown: "&6Вайп &7» &cНеизвестная подкоманда. Используй: /pivovipe start"
  reloaded: "&6Вайп &7» &aКонфиг pivo-vipe перезагружен."