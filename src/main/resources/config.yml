# Настройки плагина pivo-vipe

# Время отсчёта в секундах
countdown-seconds: 120

# Текст тайтла во время отсчёта (title / subtitle)
# Доступный плейсхолдер: %time%
title:
  main: "&6&lВайп"
  sub: "&fДо закрытие вайпа осталось %time%"

# Текст в момент закрытия сервера на вайп
end-title:
  main: "&6&lВайп"
  sub: "&cСервер закрыт на вайп!"

# Сообщение в чат всем игрокам в момент вайпа
broadcast-message: "&6&lВайп &fсервер закрывается на вайп!"

# Сообщения команд
messages:
  started: "&aОтсчёт до вайпа запущен (%time%)."
  already-running: "&cОтсчёт до вайпа уже запущен!"
  usage: "&cИспользование: /pivovipe start"
  unknown: "&cНеизвестная подкоманда. Используй: /pivovipe start"
  reloaded: "&aКонфиг pivo-vipe перезагружен."
